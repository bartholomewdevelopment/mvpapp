<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="vt-title vt-desc">
  <title id="vt-title">Ninety percent of startups fail, shown as a hundred squares</title>
  <desc id="vt-desc">A grid of one hundred squares stands for one hundred startups. Ninety are faint, representing those that fail. The final row of ten is coral, representing those that survive.</desc>

  

  <defs>
    
    <g id="frow" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.09)">
      <rect x="0" y="0" width="44" height="44" rx="6"></rect>
      <rect x="60" y="0" width="44" height="44" rx="6"></rect>
      <rect x="120" y="0" width="44" height="44" rx="6"></rect>
      <rect x="180" y="0" width="44" height="44" rx="6"></rect>
      <rect x="240" y="0" width="44" height="44" rx="6"></rect>
      <rect x="300" y="0" width="44" height="44" rx="6"></rect>
      <rect x="360" y="0" width="44" height="44" rx="6"></rect>
      <rect x="420" y="0" width="44" height="44" rx="6"></rect>
      <rect x="480" y="0" width="44" height="44" rx="6"></rect>
      <rect x="540" y="0" width="44" height="44" rx="6"></rect>
    </g>
  </defs>

  <g font-family="&#39;JetBrains Mono&#39;,ui-monospace,monospace" font-size="16" font-weight="500" letter-spacing="2.88" fill="#94a3b8">
    <text x="100" y="170">THE BASE RATE</text>
    <text x="916" y="128">100 STARTUPS</text>
    <text x="916" y="800" fill="#ffb4ae">10 STILL STANDING</text>
  </g>

  <g font-family="&#39;Instrument Sans&#39;,&#39;Inter&#39;,system-ui,sans-serif" fill="#f8fafc" style="font-variant-numeric:tabular-nums lining-nums">
    <text x="100" y="404" font-size="190" font-weight="700" letter-spacing="-7.6">90%</text>
    <text x="100" y="470" font-size="36" font-weight="600" letter-spacing="-0.72">of startups fail</text>
  </g>

  <line x1="100" y1="524" x2="700" y2="524" stroke="rgba(255,255,255,0.09)"></line>

  <g font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="20" fill="#cbd5e1">
    <text x="100" y="572">The gate exists to decide which side of this</text>
    <text x="100" y="602">grid you land on — before the build budget</text>
    <text x="100" y="632">is spent, not after.</text>
  </g>

  
  <g transform="translate(916,158)">
    <use href="#frow" y="0"></use>
    <use href="#frow" y="60"></use>
    <use href="#frow" y="120"></use>
    <use href="#frow" y="180"></use>
    <use href="#frow" y="240"></use>
    <use href="#frow" y="300"></use>
    <use href="#frow" y="360"></use>
    <use href="#frow" y="420"></use>
    <use href="#frow" y="480"></use>
    
    <g transform="translate(0,540)" fill="#fd6a62">
      <rect x="0" y="0" width="44" height="44" rx="6"></rect>
      <rect x="60" y="0" width="44" height="44" rx="6"></rect>
      <rect x="120" y="0" width="44" height="44" rx="6"></rect>
      <rect x="180" y="0" width="44" height="44" rx="6"></rect>
      <rect x="240" y="0" width="44" height="44" rx="6"></rect>
      <rect x="300" y="0" width="44" height="44" rx="6"></rect>
      <rect x="360" y="0" width="44" height="44" rx="6"></rect>
      <rect x="420" y="0" width="44" height="44" rx="6"></rect>
      <rect x="480" y="0" width="44" height="44" rx="6"></rect>
      <rect x="540" y="0" width="44" height="44" rx="6"></rect>
    </g>
  </g>
</svg>