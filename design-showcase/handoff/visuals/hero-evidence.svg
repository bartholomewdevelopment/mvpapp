<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-labelledby="he-title he-desc">
  <title id="he-title">Evidence converging into a shipped product</title>
  <desc id="he-desc">Three translucent panels of evidence — interview transcripts, a pricing signal, and signed commitments — send light down into a single crisp product interface below, which carries the brand&#39;s coral call to action.</desc>

  
  

  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".055"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".018"></stop>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"></stop>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".28"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="beamgrad" gradientUnits="userSpaceOnUse" x1="0" y1="540" x2="0" y2="895">
      <stop offset="0" stop-color="#fd6a62" stop-opacity=".05"></stop>
      <stop offset="1" stop-color="#fd6a62" stop-opacity=".5"></stop>
    </linearGradient>
    <radialGradient id="halograd">
      <stop offset="0" stop-color="#fd6a62" stop-opacity=".5"></stop>
      <stop offset="1" stop-color="#fd6a62" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="underglow">
      <stop offset="0" stop-color="#fd6a62" stop-opacity=".3"></stop>
      <stop offset="1" stop-color="#fd6a62" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="liftCard" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity=".55"></feDropShadow>
    </filter>
    <filter id="liftHigh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="34" flood-color="#000000" flood-opacity=".65"></feDropShadow>
    </filter>
    <filter id="coralGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#fd6a62" flood-opacity=".55"></feDropShadow>
    </filter>
  </defs>

  

  
  <g transform="rotate(-6 260 390)" filter="url(#liftCard)">
    <rect x="110" y="200" width="300" height="380" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.09)"></rect>
    <rect x="127" y="201" width="266" height="1" fill="url(#edge)"></rect>
    <rect x="142" y="238" width="104" height="8" rx="4" fill="rgba(253,106,98,0.55)"></rect>
    <g fill="rgba(255,255,255,0.15)">
      <rect x="142" y="290" width="236" height="8" rx="4"></rect>
      <rect x="142" y="324" width="188" height="8" rx="4" fill="rgba(255,255,255,0.24)"></rect>
      <rect x="142" y="358" width="220" height="8" rx="4"></rect>
      <rect x="142" y="392" width="150" height="8" rx="4"></rect>
      <rect x="142" y="426" width="232" height="8" rx="4" fill="rgba(255,255,255,0.24)"></rect>
      <rect x="142" y="460" width="176" height="8" rx="4"></rect>
      <rect x="142" y="494" width="208" height="8" rx="4"></rect>
    </g>
  </g>

  
  <g filter="url(#liftCard)">
    <rect x="450" y="150" width="300" height="380" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.09)"></rect>
    <rect x="467" y="151" width="266" height="1" fill="url(#edge)"></rect>
    <rect x="482" y="188" width="104" height="8" rx="4" fill="rgba(253,106,98,0.55)"></rect>
    <g fill="rgba(255,255,255,0.16)">
      <rect x="482" y="440" width="30" height="60" rx="6"></rect>
      <rect x="530" y="390" width="30" height="110" rx="6"></rect>
      <rect x="578" y="350" width="30" height="150" rx="6"></rect>
      <rect x="674" y="410" width="30" height="90" rx="6"></rect>
      <rect x="722" y="452" width="30" height="48" rx="6"></rect>
    </g>
    <rect x="626" y="310" width="30" height="190" rx="6" fill="#fd6a62"></rect>
  </g>

  
  <g transform="rotate(6 940 390)" filter="url(#liftCard)">
    <rect x="790" y="200" width="300" height="380" rx="16" fill="url(#glass)" stroke="rgba(255,255,255,0.09)"></rect>
    <rect x="807" y="201" width="266" height="1" fill="url(#edge)"></rect>
    <rect x="822" y="238" width="104" height="8" rx="4" fill="rgba(253,106,98,0.55)"></rect>
    <g fill="rgba(255,255,255,0.15)">
      <rect x="864" y="292" width="180" height="8" rx="4"></rect>
      <rect x="864" y="382" width="150" height="8" rx="4"></rect>
      <rect x="864" y="472" width="196" height="8" rx="4"></rect>
    </g>
    <g fill="none" stroke="#fd6a62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
      <path d="M822 296 l9 10 l17 -20"></path>
      <path d="M822 386 l9 10 l17 -20"></path>
      <path d="M822 476 l9 10 l17 -20"></path>
    </g>
  </g>

  
  <g class="beam" stroke="url(#beamgrad)" stroke-width="1.5" opacity=".8">
    <line x1="258" y1="596" x2="596" y2="884"></line>
    <line x1="600" y1="546" x2="600" y2="884"></line>
    <line x1="942" y1="596" x2="604" y2="884"></line>
  </g>
  <ellipse class="halo" cx="600" cy="893" rx="230" ry="46" fill="url(#halograd)" opacity=".75"></ellipse>

  
  <ellipse cx="600" cy="1130" rx="520" ry="290" fill="url(#underglow)"></ellipse>
  <g filter="url(#liftHigh)">
    <rect x="170" y="900" width="860" height="470" rx="22" fill="#0f172a" stroke="rgba(255,255,255,0.16)"></rect>
    <rect x="210" y="901" width="780" height="1" fill="url(#edge)"></rect>

    
    <line x1="170" y1="972" x2="1030" y2="972" stroke="rgba(255,255,255,0.09)"></line>
    <rect x="206" y="925" width="20" height="20" rx="6" fill="#fd6a62"></rect>
    <g fill="rgba(255,255,255,0.16)">
      <rect x="906" y="931" width="52" height="8" rx="4"></rect>
      <rect x="968" y="931" width="26" height="8" rx="4"></rect>
    </g>

    
    <rect x="206" y="1014" width="430" height="18" rx="9" fill="rgba(255,255,255,0.30)"></rect>
    <rect x="206" y="1046" width="300" height="18" rx="9" fill="rgba(255,255,255,0.16)"></rect>
    <rect x="206" y="1096" width="168" height="46" rx="12" fill="#fd6a62" filter="url(#coralGlow)"></rect>
    <rect x="392" y="1096" width="132" height="46" rx="12" fill="none" stroke="rgba(255,255,255,0.16)"></rect>

    
    <g>
      <rect x="206" y="1196" width="249" height="132" rx="12" fill="rgba(255,255,255,0.032)" stroke="rgba(255,255,255,0.09)"></rect>
      <rect x="232" y="1226" width="80" height="8" rx="4" fill="rgba(253,106,98,0.55)"></rect>
      <rect x="232" y="1254" width="150" height="8" rx="4" fill="rgba(255,255,255,0.16)"></rect>
      <rect x="232" y="1278" width="110" height="8" rx="4" fill="rgba(255,255,255,0.10)"></rect>

      <rect x="475" y="1196" width="249" height="132" rx="12" fill="rgba(255,255,255,0.032)" stroke="rgba(255,255,255,0.09)"></rect>
      <rect x="501" y="1226" width="80" height="8" rx="4" fill="rgba(253,106,98,0.55)"></rect>
      <rect x="501" y="1254" width="168" height="8" rx="4" fill="rgba(255,255,255,0.16)"></rect>
      <rect x="501" y="1278" width="96" height="8" rx="4" fill="rgba(255,255,255,0.10)"></rect>

      <rect x="744" y="1196" width="249" height="132" rx="12" fill="rgba(255,255,255,0.032)" stroke="rgba(255,255,255,0.09)"></rect>
      <rect x="770" y="1226" width="80" height="8" rx="4" fill="rgba(253,106,98,0.55)"></rect>
      <rect x="770" y="1254" width="140" height="8" rx="4" fill="rgba(255,255,255,0.16)"></rect>
      <rect x="770" y="1278" width="124" height="8" rx="4" fill="rgba(255,255,255,0.10)"></rect>
    </g>
  </g>
</svg>